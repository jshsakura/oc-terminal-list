name: Build & Push to GHCR

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux openssh-client ripgrep
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt pytest pytest-asyncio httpx ruff
          npm ci --prefix frontend
      - name: Critical Python lint
        run: .venv/bin/ruff check backend --select E9,F63,F7,F82
      - name: Backend tests (aggregate 4 GiB limit)
        run: |
          sudo systemd-run --wait --pipe --collect -p MemoryMax=4G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE/backend" \
            /bin/bash "$GITHUB_WORKSPACE/.github/scripts/within-memory-limit.sh" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q
      - name: Frontend tests (aggregate 4 GiB limit)
        run: |
          sudo systemd-run --wait --pipe --collect -p MemoryMax=4G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE/frontend" \
            /bin/bash "$GITHUB_WORKSPACE/.github/scripts/within-memory-limit.sh" \
            "$(command -v node)" node_modules/vitest/vitest.mjs run --maxWorkers=1
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Release ${GITHUB_REF_NAME#v}"
