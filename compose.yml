version: "3.8"

services:
  backend:
    image: jshsakura/oc-terminal-list:latest
    container_name: oc-terminal-backend
    ports:
      - 28022:8000
    environment:
      - DB_PATH=/app/data/octerminallist.db
      - WORKSPACE_ROOT=/app/workspace
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-this
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - SHELL=/bin/bash
    volumes:
      # 1. 데이터 및 워크스페이스 영속화
      - ./data:/app/data
      - ./workspace:/app/workspace
      
      # 2. 홈 디렉토리 영속화 (가장 중요!)
      # 컨테이너 터미널에서 nvm, pip 등으로 설치한 도구와 설정들이 영구 보존됩니다.
      - terminal_home:/root
      
      # 3. 호스트 도커 제어 (Docker-in-Docker)
      # 터미널 내부에서 'docker' 명령어를 사용하여 호스트의 컨테이너를 관리할 수 있습니다.
      - /var/run/docker.sock:/var/run/docker.sock
      
      # 4. 호스트 환경 설정 공유 (Claude & OpenCode)
      - /home/ubuntu/.config/Claude:/root/.config/Claude:ro
      - /home/ubuntu/.config/opencode:/root/.config/opencode:ro
      
    restart: unless-stopped
    networks:
      - terminal-net

networks:
  terminal-net:
    driver: bridge

volumes:
  # 이름이 있는 볼륨으로 /root를 관리하여 컨테이너 재생성 시에도 데이터 유지
  terminal_home:
  # 기존 volumes 정의 유지 (필요시)
  app-data:
