version: "3.8"

services:
  backend:
    image: jshsakura/oc-terminal-list:latest
    container_name: oc-terminal-backend
    ports:
      - 28022:8000
    environment:
      - DB_PATH=/app/data/octerminallist.db
      - WORKSPACE_ROOT=/app/workspace
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-this
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - SHELL=/bin/bash
    volumes:
      # 사용자 요청 절대 경로 마운트
      - ./app-data:/app/data
      - /dev/pts:/dev/pts
      - /home/ubuntu/app/jupyterLab/notebooks:/app/workspace
      
      # 기타 설정 유지
      - terminal_home:/root
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.config/Claude:/root/.config/Claude:ro
      - /home/ubuntu/.config/opencode:/root/.config/opencode:ro
      
    restart: unless-stopped
    networks:
      - terminal-net

networks:
  terminal-net:
    driver: bridge

volumes:
  terminal_home:
  app-data:
