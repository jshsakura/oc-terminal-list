# Terminal List — single-set bundle (app + Redis).
#
# Quick start:
#   docker compose up -d
#   open http://localhost:38822
#
# 호스트 등록은 UI 에서 직접 — 자동 등록은 기본 OFF.
# (자동 등록을 굳이 쓰고 싶으면 BOOTSTRAP_HOST_ENABLE=1 + ./secrets/ssh-key 마운트.
#  여러 번 재부팅 시 탭 복원과 충돌하는 부작용이 있어 권장하지 않음.)
#
# 포트 바꾸기:
#   APP_PORT=9000 docker compose up -d  (또는 .env 에 설정)
services:
  app:
    image: ghcr.io/jshsakura/oc-terminal-list:latest
    container_name: oc-terminal-list
    restart: unless-stopped
    ports:
      - "${APP_PORT:-38822}:${APP_PORT:-38822}"
    environment:
      HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-38822}
      DB_PATH: /app/data/iterminallist.db
      WORKSPACE_ROOT: /workspace
      # 컨테이너 내 Redis — compose 네트워크의 서비스명을 host 로 사용
      REDIS_URL: redis://redis:6379/0
      #
      # (선택) 호스트 자동 등록 — 기본 OFF. 켜고 싶으면 아래 줄 주석 해제하고
      # ./secrets/ssh-key 파일을 두면 첫 부팅 시 host.docker.internal 호스트가 등록된다.
      # BOOTSTRAP_HOST_ENABLE: "1"
      # BOOTSTRAP_HOST_HOSTNAME: host.docker.internal
      # BOOTSTRAP_HOST_USER: ubuntu
      # BOOTSTRAP_HOST_NAME: "Docker Host"
      # BOOTSTRAP_HOST_KEY_PASSPHRASE: ""
      # BOOTSTRAP_HOST_START_PATH: /home/ubuntu
    volumes:
      - ./data:/app/data
      - ./workspace:/workspace
      # 자동 등록 켰을 때만 필요한 read-only key 마운트. 일반 사용에선 불필요.
      # - ./secrets:/app/secrets:ro
    # Linux 에서도 host.docker.internal 을 호스트 게이트웨이로 매핑 (Docker Desktop 기본 제공).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${APP_PORT:-38822}/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # LLM 사용량 대시보드 — 옵션. 프로필로 감싸서 기본 `up` 에는 안 뜬다.
  #
  #   docker compose --profile usage up -d
  #
  # 켜면 app 이 compose 네트워크에서 `llm-watcher:34318` 을 자동으로 찾는다(설정 0).
  # 그다음 설정 화면에서 "LLM usage" 를 켜야 대시보드에 구획이 생긴다 — 에이전트
  # 기능은 옵트인이다.
  #
  # ⚠️ **호스트 포트를 열지 않는다.** compose 네트워크 안에서만 보인다. 이 서비스는
  # 프로젝트명과 프롬프트 첫 줄을 보여주고 기본 인증이 없다. 굳이 밖에서 봐야 하면
  # 포트를 여는 대신 LLMW_API_KEY 를 켜라.
  llm-watcher:
    image: ghcr.io/jshsakura/llm-watcher:latest
    container_name: oc-terminal-list-llm-watcher
    profiles: ["usage"]
    restart: unless-stopped
    environment:
      # 비우면 인증 없음. compose 내부 네트워크 전용이라 기본은 이대로 둔다.
      LLMW_API_KEY: "${LLMW_API_KEY:-}"
    # 마운트한 로그의 소유자와 맞아야 읽는다. `id -u` 가 1000 이 아니면 .env 에서 조정.
    user: "${WATCHER_UID:-1000}:${WATCHER_GID:-1000}"
    volumes:
      # 호스트의 에이전트 로그 — 전부 읽기 전용. 안 쓰는 에이전트 줄은 지워라
      # (남기면 없는 경로가 root 소유 빈 디렉토리로 생긴다).
      - ${HOME}/.claude:/home/watcher/.claude:ro
      - ${HOME}/.codex:/home/watcher/.codex:ro
      - ${HOME}/.local/share/opencode:/home/watcher/.local/share/opencode:ro
      - oc-terminal-list-watcher-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:alpine
    container_name: oc-terminal-list-redis
    restart: unless-stopped
    # 외부 노출 X — app 컨테이너만 redis://redis:6379 로 접근
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      # named volume — Redis 컨테이너는 redis 유저(uid 999)로 실행되므로 권한 충돌 없게.
      - oc-terminal-list-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  oc-terminal-list-redis-data:
  oc-terminal-list-watcher-data:
