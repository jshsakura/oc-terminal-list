version: "3.8"

services:
  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: oc-terminal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - terminal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Main Application (Backend + Frontend)
  app:
    image: jshsakura/oc-terminal-list:latest
    container_name: oc-terminal-personal
    restart: unless-stopped
    ports:
      - "28022:8000"
    environment:
      - DB_PATH=/app/data/octerminallist.db
      - WORKSPACE_ROOT=/workspace
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - SHELL=/bin/bash
      - PYTHONUNBUFFERED=1
    volumes:
      # 1. 앱 데이터 및 코드 워크스페이스
      - ./data:/app/data
      - ./workspace:/workspace
      
      # 2. 터미널 환경 영속화
      - ./home:/root
      
      # 3. 호스트 도커 제어
      - /var/run/docker.sock:/var/run/docker.sock
      
      # 4. 호스트 환경 설정 공유 (Claude & OpenCode)
      - /home/ubuntu/.config/Claude:/root/.config/Claude:ro
      - /home/ubuntu/.config/opencode:/root/.config/opencode:ro
      
      # 5. PTY 장치 공유
      - /dev/pts:/dev/pts
      
    privileged: true
    networks:
      - terminal-net
    depends_on:
      redis:
        condition: service_healthy

networks:
  terminal-net:
    driver: bridge

volumes:
  redis-data:
