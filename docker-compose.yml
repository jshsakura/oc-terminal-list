# Terminal List — single-set bundle (app + Redis).
#
# Quick start:
#   docker compose up -d
#   open http://localhost:38822
#
# 영속 데이터는 두 볼륨에 담긴다:
#   iterminallist-data       : SQLite + vault key + 설정
#   iterminallist-workspace  : 사용자 작업 파일 (호스트 경로 마운트로 바꾸려면 아래 주석 참고)
#   iterminallist-redis-data : Redis AOF
#
# 호스트의 디렉토리를 그대로 workspace 로 쓰고 싶다면:
#   volumes 의 iterminallist-workspace 자리를 ./workspace:/workspace 같은 bind 로 교체.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iterminallist:latest
    container_name: iterminallist-app
    restart: unless-stopped
    ports:
      - "38822:38822"
    environment:
      # in-container Redis 사용 — compose 가 만든 서비스 이름을 hostname 으로
      REDIS_URL: redis://redis:6379/0
      # 그 외 기본값은 Dockerfile ENV 참고. 필요시 여기서 override.
      #
      # 부팅 시 호스트 자동 등록 — secrets/ssh-key 파일이 있으면 그대로 자동 진행.
      # 모든 값은 sensible default 로 잡혀있고, 바꿔야 할 때만 아래 env 풀면 됨.
      # BOOTSTRAP_HOST_HOSTNAME: host.docker.internal       # Docker Desktop/Linux 모두 작동 (extra_hosts 참고)
      # BOOTSTRAP_HOST_USER: ubuntu
      # BOOTSTRAP_HOST_NAME: "Docker Host"
      # BOOTSTRAP_HOST_KEY_PASSPHRASE: ""
      # BOOTSTRAP_HOST_START_PATH: /home/ubuntu
    # Linux 에서도 host.docker.internal 을 호스트 게이트웨이로 매핑 (Docker Desktop 은 기본 제공).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - iterminallist-data:/app/data
      - iterminallist-workspace:/workspace
      # SSH key 마운트 — BOOTSTRAP_HOST_AUTH=key 일 때 host.docker.internal 등으로 붙기 위한 키.
      # 호스트의 ~/.ssh/id_ed25519 같은 파일을 ./secrets/ssh-key 에 복사하거나 심볼릭 링크.
      - ./secrets:/app/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:38822/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: iterminallist-redis
    restart: unless-stopped
    # 외부 노출 안 함 — app 컨테이너만 redis://redis:6379 로 접근.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - iterminallist-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  iterminallist-data:
  iterminallist-workspace:
  iterminallist-redis-data:
