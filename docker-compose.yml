version: '3.8'

services:
  # Redis for session storage
  redis:
    image: redis:7-alpine
    container_name: oc-terminal-list-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - iterminal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # OC Terminal List application
  app:
    image: jshsakura/oc-terminal-list:latest
    container_name: oc-terminal-list-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DB_PATH=/app/data/octerminallist.db
      - WORKSPACE_ROOT=/app/workspace
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app-data:/app/data
      - /dev/pts:/dev/pts
      - /home/ubuntu/app/jupyterLab/notebooks:/app/workspace
    privileged: true
    networks:
      - iterminal-network
    depends_on:
      redis:
        condition: service_healthy

networks:
  iterminal-network:
    driver: bridge

volumes:
  redis-data:
  app-data:
