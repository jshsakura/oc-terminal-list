<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terminal List" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Terminal List</title>
    <style>
      /* JetBrainsMono Nerd Font (로컬 번들, 패치된 모노 + Nerd 글리프 포함) */
      @font-face {
        font-family: 'JetBrainsMono Nerd Font Mono';
        src: url('/fonts/JetBrainsMonoNerdFontMono-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'JetBrainsMono Nerd Font Mono';
        src: url('/fonts/JetBrainsMonoNerdFontMono-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        background: #1e1e2e;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
      }

      html::-webkit-scrollbar, body::-webkit-scrollbar, #root::-webkit-scrollbar {
        display: none; /* Chrome, Safari */
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        font-weight: 400;
        font-style: normal;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 백스페이스로 뒤로가기 방지
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' || e.keyCode === 8) {
          const target = e.target;
          const isEditable = target.tagName === 'INPUT' ||
                           target.tagName === 'TEXTAREA' ||
                           target.isContentEditable;

          // 입력 필드가 아니면 백스페이스 막기
          if (!isEditable) {
            e.preventDefault();
          }
        }
      });

      // 브라우저 기본 우클릭 메뉴 전역 차단 (커스텀 메뉴는 컴포넌트별로 처리)
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
